services:
  postgres:
    image: postgres:16-alpine
    profiles: ["python"]
    environment:
      POSTGRES_DB: whaledecode
      POSTGRES_USER: whaledecode
      POSTGRES_PASSWORD: whaledecode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whaledecode"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.python
    profiles: ["python"]
    command: serve
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  core:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PORT: "8787"
      DB_PATH: /app/data/core.db
    ports:
      - "8787:8787"
    volumes:
      - coredata:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  coredata:
