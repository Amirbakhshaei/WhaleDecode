services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whaledecode
      POSTGRES_USER: whaledecode
      POSTGRES_PASSWORD: whaledecode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whaledecode"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    command: bot
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
