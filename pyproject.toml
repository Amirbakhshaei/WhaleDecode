[tool.poetry]
name = "whaledecode"
version = "0.1.0"
description = "AI Smart Money Agent — Telegram bot for whale wallet monitoring"
authors = ["WhaleDecode Team"]
readme = "README.md"
packages = [{ include = "whaledecode", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pydantic = "^2.6"
pydantic-settings = "^2.1"
aiogram = "^3.4"
sqlalchemy = "^2.0"
asyncpg = "^0.31"
alembic = "^1.13"

httpx = "^0.27"
langchain-core = ">=0.3.81"
langgraph = ">=0.2.60"
langchain-openai = ">=0.2.0"
langchain-google-genai = ">=2.0"
langchain-groq = ">=0.2.0"
structlog = "^24.1"
tenacity = "^8.2"
jinja2 = "^3.1"
click = "^8.1"
pyyaml = "^6.0"
langgraph-checkpoint-postgres = ">=2.0"
langsmith = ">=0.2.0"
apscheduler = "^3.11.3"
aiolimiter = "^1.2.1"
python-telegram-bot = "^22.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-mock = "^3.12"
ruff = "^0.3"
mypy = "^1.8"
respx = "^0.21"
types-pyyaml = "^6.0"
aiosqlite = "^0.22.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
whaledecode = "whaledecode.main:cli"
